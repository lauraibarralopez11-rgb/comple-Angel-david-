<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Ángel David</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PRIMERA PÁGINA -->
    <section id="portada">

        <button id="abrir">
            Abrir invitación
        </button>

    </section>

    <!-- SEGUNDA PÁGINA -->
    <section id="segunda">

        <!-- GIF DE FONDO -->
        <img src="segunda.gif" id="gifFondo" alt="Invitación">

        <!-- BOTONES -->
        <div class="overlay">

            <div class="botones">

                <a href="https://wa.me/573126195619?text=Hola,%20confirmo%20mi%20asistencia%20al%20cumpleaños%20de%20Ángel%20David.%20¡Nos%20vemos!"
                    target="_blank"
                    class="btn whatsapp">
                    Confirmar WhatsApp
                </a>

                <a href="https://maps.app.goo.gl/PHXae3BADZsVm11f8?g_st=ic"
                    target="_blank"
                    class="btn ubicacion">
                    Ver ubicación
                </a>

            </div>

        </div>

    </section>

    <!-- TERCERA PÁGINA -->
    <section id="tercera">

        <img src="tercera.gif" id="gifFinal" alt="Final">

    </section>

    <!-- MÚSICA -->
    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>

</html>
